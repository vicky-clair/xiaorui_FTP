name: Security & Supply Chain Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  rust-security:
    name: RustSec Audit & Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-audit (RustSec advisory database)
        uses: rustsec/audit-check@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo-deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --config src-tauri/deny.toml check licenses bans sources

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL SAST (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM via Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: xiaorui_FTP-sbom.cdx.json
          upload-artifact: true
          artifact-name: xiaorui_FTP-sbom
