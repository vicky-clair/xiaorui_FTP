name: Build xiaorui_FTP (All x64 Platforms)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript strict type check
        run: npx tsc --noEmit

      - name: Run frontend unit & security tests (Vitest)
        run: npm test

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust Clippy check (-D warnings)
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Run Rust unit & security tests
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - name: Build Tauri x64 bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
